name: Deploy to SmartApe (FTP)

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write production .env
        run: printf '%s' "${{ secrets.ENV_FILE }}" > .env

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Find webroot path (temporary diagnostic)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "--- whoami ---"
            whoami
            echo "--- home dir (pwd) ---"
            pwd
            echo "--- contents of home dir ---"
            ls -la
            echo "--- contents one level down (if any dirs) ---"
            for d in */; do echo "[$d]"; ls -la "$d" 2>/dev/null; done
            echo "--- searching for the domain folder ---"
            find / -maxdepth 6 -iname "*smrtp*" 2>/dev/null
            find / -maxdepth 6 -iname "index.php" 2>/dev/null | grep -v node_modules

      - name: Deploy via SFTP
        uses: wangyucode/sftp-upload-action@v2.0.4
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          localDir: .
          remoteDir: /www/s18113211.smrtp.ru/
          exclude: >-
            .git,.git/**,
            .github,.github/**,
            .idea,.idea/**,
            .claude,.claude/**,
            node_modules,node_modules/**,
            tests,tests/**,
            .env.example,.env.production,
            .editorconfig,.gitattributes,.npmrc,
            boost.json,phpstan.neon,phpunit.xml,pint.json,CLAUDE.md,
            Claude outputs,Claude outputs/**,
            storage/logs,storage/logs/**,
            storage/framework/cache,storage/framework/cache/**,
            storage/framework/sessions,storage/framework/sessions/**,
            storage/framework/views,storage/framework/views/**,
            public/storage,public/storage/**,
            public/hot
