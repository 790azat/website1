name: Deploy to SmartApe (rsync over SSH)

# Auto-deploy on push is temporarily disabled; run it manually from the
# Actions tab if needed. To re-enable, restore:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    # One deploy at a time; a newer push replaces a queued one instead of
    # uploading alongside the one already running.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restore file timestamps from git history
        uses: chetan/git-restore-mtime-action@v2

      - name: Write production .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: printf '%s\n' "$ENV_FILE" > .env

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist

      - name: Cache site content
        run: php artisan content:cache

      # Route and event caches hold no server paths, so they can be built
      # here and uploaded. The config cache does (storage, database paths)
      # and is left out.
      - name: Cache routes and events
        run: |
          php artisan route:cache
          php artisan event:cache

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Install rsync tools
        run: sudo apt-get update && sudo apt-get install -y sshpass rsync

      - name: Deploy via rsync over SSH
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -e
          # A re-run of an older deploy must not overwrite newer code on the server.
          git fetch --quiet origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "::notice::Skipping deploy: $GITHUB_SHA is no longer the head of main."
            exit 0
          fi
          sshpass -e rsync -az --stats \
            -e "ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.idea' \
            --exclude='.claude' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='.env.example' \
            --exclude='.env.production' \
            --exclude='.editorconfig' \
            --exclude='.gitattributes' \
            --exclude='.npmrc' \
            --exclude='boost.json' \
            --exclude='phpstan.neon' \
            --exclude='phpunit.xml' \
            --exclude='pint.json' \
            --exclude='CLAUDE.md' \
            --exclude='Claude outputs' \
            --exclude='/storage/logs' \
            --exclude='/storage/framework/cache' \
            --exclude='/storage/framework/sessions' \
            --exclude='/storage/framework/views' \
            --exclude='/public/storage' \
            --exclude='/public/hot' \
            ./ "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:www/s18113211.smrtp.ru/"

          # Compiled Blade views are not synced; drop them so every view is
          # recompiled from the files just deployed.
          sshpass -e ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            'rm -f www/s18113211.smrtp.ru/storage/framework/views/*.php' \
            || echo "::warning::Could not clear compiled views on the server."
