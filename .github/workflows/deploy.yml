name: Deploy to SmartApe (SFTP)

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write production .env
        run: printf '%s' "${{ secrets.ENV_FILE }}" > .env

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Package deploy archive
        run: |
          set -e
          tar -czf "$RUNNER_TEMP/payload.tar.gz" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.idea' \
            --exclude='.claude' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='.env.example' \
            --exclude='.env.production' \
            --exclude='.editorconfig' \
            --exclude='.gitattributes' \
            --exclude='.npmrc' \
            --exclude='boost.json' \
            --exclude='phpstan.neon' \
            --exclude='phpunit.xml' \
            --exclude='pint.json' \
            --exclude='CLAUDE.md' \
            --exclude='Claude outputs' \
            --exclude='./storage/logs' \
            --exclude='./storage/framework/cache' \
            --exclude='./storage/framework/sessions' \
            --exclude='./storage/framework/views' \
            --exclude='./public/storage' \
            --exclude='./public/hot' \
            .
          mkdir -p deploy_payload
          mv "$RUNNER_TEMP/payload.tar.gz" deploy_payload/payload.tar.gz

      - name: Upload deploy archive via SFTP
        uses: wangyucode/sftp-upload-action@v2.0.4
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          localDir: deploy_payload
          remoteDir: www/s18113211.smrtp.ru/
          forceUpload: true

      - name: Extract archive on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            cd www/s18113211.smrtp.ru
            tar -xzf payload.tar.gz
            rm -f payload.tar.gz
